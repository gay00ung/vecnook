name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked version to crates.io
        required: true
        type: boolean
        default: false
      candidate_version:
        description: Checked VERSION-rc.N whose registry distribution and soak receipts are release assets (stable only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable fmt --check
          cargo +stable test --offline
          cargo +stable clippy --offline --all-targets -- -D warnings
          cargo +stable doc --offline --no-deps
          python3 tools/check_package.py --prepare-decoys
          cargo +stable package --offline
          python3 tools/check_package.py
          python3 tools/check_links.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Require evidence for stable publication
        if: inputs.publish
        env:
          VECNOOK_CANDIDATE: ${{ inputs.candidate_version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_publication.py --candidate-version "$VECNOOK_CANDIDATE"
      - name: Publish authenticated package
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Registry credentials are missing. Configure CARGO_REGISTRY_TOKEN before publishing.'
            exit 1
          fi
          cargo +stable publish --locked
