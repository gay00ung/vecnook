name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked version to crates.io
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable fmt --check
          cargo +stable test --offline
          cargo +stable clippy --offline --all-targets -- -D warnings
          cargo +stable doc --offline --no-deps
          python3 tools/check_package.py --prepare-decoys
          cargo +stable package --offline
          python3 tools/check_package.py
      - name: Publish authenticated package
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Registry credentials are missing. Configure CARGO_REGISTRY_TOKEN before publishing.'
            exit 1
          fi
          cargo +stable publish --locked
