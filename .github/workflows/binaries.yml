name: Native CLI archives

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build native binary
        run: cargo build --locked --offline --release
      - name: Verify extracted archive
        run: python tools/package_binary.py --binary target/release/vecnook${{ runner.os == 'Windows' && '.exe' || '' }} --output work/native-cli
      - name: Build optional platform companion
        run: cargo build --locked --offline --release --manifest-path extensions/accel/Cargo.toml
      - name: Verify extracted platform companion
        run: python tools/package_binary.py --manifest extensions/accel/Cargo.toml --binary extensions/accel/target/release/vecnook-accel${{ runner.os == 'Windows' && '.exe' || '' }} --output work/native-cli
      - name: Preserve archive and independent receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cli-${{ matrix.os }}
          path: work/native-cli/*
          retention-days: 30
