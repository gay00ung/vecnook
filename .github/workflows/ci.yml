name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      registry_version:
        description: Optional exact registry version to install and verify
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-directory-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Observe standard-library directory synchronization
        shell: pwsh
        run: |
          Get-Volume | Select-Object DriveLetter,FileSystem
          rustc tools/windows_probe.rs -o windows-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./windows-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, '1.89.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Format
        run: cargo +${{ matrix.rust }} fmt --check
      - name: Test
        run: cargo +${{ matrix.rust }} test --offline
      - name: Lint
        run: cargo +${{ matrix.rust }} clippy --offline --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.rust }} doc --offline --no-deps
      - name: Release build
        run: cargo +${{ matrix.rust }} build --offline --release
      - name: Document search integration
        env:
          VECNOOK_BINARY: target/release/vecnook${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python -m unittest discover -s examples/documents -p 'test_*.py'
          python tools/check_contracts.py
      - name: Application backend and restart
        run: |
          cargo +${{ matrix.rust }} run --offline --example local_app -- work/ci-app
          cargo +${{ matrix.rust }} run --offline --example local_app -- work/ci-app
      - name: Verify package
        run: |
          python tools/check_package.py --prepare-decoys
          cargo +${{ matrix.rust }} package --offline
          python tools/check_package.py
      - name: Public documentation links
        run: python tools/check_links.py
      - name: Fresh packaged consumers
        run: |
          package=$(find target/package -maxdepth 1 -name 'vecnook-*.crate' -print -quit)
          python tools/check_distribution.py --crate "$package" --toolchain "${{ matrix.rust }}" --output work/packaged-consumer
      - name: Actual registry consumers
        if: github.event_name == 'workflow_dispatch' && inputs.registry_version != ''
        env:
          VECNOOK_REGISTRY_VERSION: ${{ inputs.registry_version }}
        run: python tools/check_distribution.py --registry "$VECNOOK_REGISTRY_VERSION" --toolchain "${{ matrix.rust }}" --output work/registry-consumer
      - name: Preserve registry distribution receipts
        if: github.event_name == 'workflow_dispatch' && inputs.registry_version != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.rust }}
          path: work/registry-consumer/receipt.json
          retention-days: 30
