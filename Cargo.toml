[package]
name = "vecnook"
version = "0.3.0-beta.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gay00ung/vecnook"
homepage = "https://github.com/gay00ung/vecnook"
readme = "README.md"
keywords = ["vector", "database", "hnsw", "embedded", "similarity"]
categories = ["database-implementations", "algorithms"]
include = ["/src/**", "/examples/*.rs", "/examples/documents/*.py", "/examples/documents/**/*.md", "/tests/**", "/docs/*.md", "/tools/*.py", "/tools/*.rs", "/tools/*.txt", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md"]
description = "A vector database with a from-scratch HNSW index and durable storage"

[lib]
name = "vecnook"
path = "src/lib.rs"

[[bin]]
name = "vecnook"
path = "src/main.rs"

[dependencies]

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[profile.release]
lto = "thin"
codegen-units = 1
